<title>Expediente Corporativo (demo)</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap">
<style>
/* Layout: registro de dos paneles. Índice de sociedades a la izquierda, expediente vivo a la derecha. */
:root{
  --bg:#F2F4F6; --surface:#FFFFFF; --sunken:#E8ECF0; --ink:#121B25; --muted:#5A6676; --line:#D8DFE6;
  --accent:#0E5C55; --accent-ink:#FFFFFF; --accent-soft:#DCECE9;
  --warn:#8A5300; --warn-soft:#FAEFD9; --bad:#A12F28; --bad-soft:#F7E2DF; --ok:#2E6A35; --ok-soft:#E1F0E2;
  --shadow:0 1px 2px rgba(18,27,37,.06), 0 8px 24px rgba(18,27,37,.06);
  --f-display:"Source Serif 4", Georgia, "Times New Roman", serif;
  --f-body:"Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --r:8px;
  --ie:#4B3BB0; --ie-soft:#E9E6FA;
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100; --c5:#e87ba4; --c6:#008300; --c7:#6250d6; --c8:#e34948; --c0:#9aa5b1;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1318; --surface:#141C23; --sunken:#1A242D; --ink:#E4EAF0; --muted:#94A1AE; --line:#26313B;
  --accent:#5CC0B2; --accent-ink:#06201D; --accent-soft:#15302C;
  --warn:#E3AA52; --warn-soft:#33270F; --bad:#EE8B82; --bad-soft:#3A1D1A; --ok:#86C98D; --ok-soft:#18301B;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); --ie:#B3A9F5; --ie-soft:#252040; --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#008300; --c7:#9085e9; --c8:#e66767; --c0:#6b7682; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0D1318; --surface:#141C23; --sunken:#1A242D; --ink:#E4EAF0; --muted:#94A1AE; --line:#26313B;
  --accent:#5CC0B2; --accent-ink:#06201D; --accent-soft:#15302C;
  --warn:#E3AA52; --warn-soft:#33270F; --bad:#EE8B82; --bad-soft:#3A1D1A; --ok:#86C98D; --ok-soft:#18301B;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); --ie:#B3A9F5; --ie-soft:#252040; --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#008300; --c7:#9085e9; --c8:#e66767; --c0:#6b7682; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);font-weight:600;text-wrap:balance;margin:0;letter-spacing:-.01em}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.muted{color:var(--muted)}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:14px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));border-bottom:1px solid var(--line);background:var(--surface)}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{font-size:20px}
.brand span{color:var(--muted);font-size:13px}
.conn{margin-left:auto;font-size:12px;display:flex;align-items:center;gap:6px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)}

.layout{display:grid;grid-template-columns:290px minmax(0,1fr);min-height:calc(100vh - 60px)}
aside{border-right:1px solid var(--line);background:var(--surface);padding-block:16px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:16px;display:flex;flex-direction:column;gap:12px}
main{padding-block:20px 48px;padding-left:24px;padding-right:max(24px, env(safe-area-inset-right, 0px));min-width:0}
@media (max-width:860px){
  .layout{grid-template-columns:1fr}
  aside{border-right:0;border-bottom:1px solid var(--line);padding-right:max(16px, env(safe-area-inset-right, 0px))}
  .soc-list{max-height:220px}
  main{padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
}
.search{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg)}
.soc-list{display:flex;flex-direction:column;gap:2px;overflow:auto;margin:0;padding:0;list-style:none}
.soc-item{width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:6px;cursor:pointer;display:flex;flex-direction:column;gap:1px}
.soc-item:hover{background:var(--sunken)}
.soc-item[aria-current="true"]{background:var(--accent-soft)}
.soc-item b{font-weight:600;font-size:13.5px}
.soc-item small{color:var(--muted);font-size:12px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{background:var(--sunken)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:none}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.small{padding:4px 9px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}

.notice{padding:10px 12px;border-radius:var(--r);font-size:13px;background:var(--warn-soft);color:var(--warn)}
.notice.info{background:var(--accent-soft);color:var(--ink)}

.head{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;justify-content:space-between;margin-bottom:16px}
.head h2{font-size:28px;line-height:1.15}
.head .acts{display:flex;gap:8px;flex-wrap:wrap}
.idcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:14px;display:flex;flex-direction:column;gap:16px}
.id-top{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;justify-content:space-between}
.id-top h2{font-size:28px;line-height:1.15}
.id-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.stat{background:var(--bg);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stat .v.mono{font-size:18px;letter-spacing:.04em}
.stat small{color:var(--muted);font-size:12px}
.stat .falta{font-size:14px;font-weight:600;color:var(--warn)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:20px}
.fact{background:var(--surface);box-shadow:inset -1px -1px 0 var(--line);padding:10px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.fact .v{font-weight:600;overflow-wrap:anywhere}
.fme{font-family:var(--f-mono);letter-spacing:.04em}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto}
.tab{border:0;background:none;padding:10px 14px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card h3{font-size:17px;margin-bottom:2px}
.card .src{font-size:12px;color:var(--muted);margin-bottom:12px}
.card.wide{grid-column:1/-1}

.caps{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:8px 0 16px}
.cap .v{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.total td{font-weight:700;border-bottom:0;border-top:2px solid var(--ink)}
.bar{height:6px;border-radius:3px;background:var(--sunken);min-width:60px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.pct{display:flex;align-items:center;gap:8px;justify-content:flex-end}

.people{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.people li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.people li:last-child{border-bottom:0}
.people .role{color:var(--muted);font-size:13px;text-align:right}
.kv{display:grid;grid-template-columns:120px minmax(0,1fr);gap:6px 12px;font-size:13.5px}
.kv dt{color:var(--muted)} .kv dd{margin:0;overflow-wrap:anywhere}

.alerts{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.alert{padding:8px 12px;border-radius:6px;font-size:13px;display:flex;gap:8px}
.alert.bad{background:var(--bad-soft);color:var(--bad)}
.alert.warn{background:var(--warn-soft);color:var(--warn)}

.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.mov{display:grid;grid-template-columns:110px minmax(0,1fr);gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
@media (max-width:560px){.mov{grid-template-columns:1fr;gap:6px}}
.mov .date{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.mov h4{margin:0 0 4px;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--sunken);font-weight:600}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.mov ul{margin:6px 0 0;padding-left:18px}
.mov .row-acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}

.chrono{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;max-width:75ch}
.ia-out{white-space:pre-wrap;max-width:75ch;line-height:1.6}

.empty{max-width:560px;margin:40px auto;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.empty h2{font-size:24px}
.empty p{color:var(--muted);margin:0}

/* Ficha visual */
.idrow{display:flex;gap:16px;align-items:center;min-width:0}
.mono-av{width:56px;height:56px;border-radius:14px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:600;font-size:22px;flex:none}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.pill{font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--sunken);color:var(--ink)}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.ie{background:var(--ie-soft);color:var(--ie)}
.card.ie{border:1px solid var(--ie);box-shadow:inset 4px 0 0 var(--ie)}
.ie-big{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ie);line-height:1.1}
.nac{font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--ie-soft);color:var(--ie);margin-left:6px;white-space:nowrap}
.stat{position:relative;padding-left:58px}
.ico{position:absolute;left:12px;top:12px;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#fff}
.ico svg{width:18px;height:18px}
.typebar{display:flex;height:8px;border-radius:4px;overflow:hidden;gap:2px;margin:6px 0 4px;background:var(--surface)}
.typebar i{display:block;height:100%}
.facts .fact{flex-direction:row;gap:10px;align-items:flex-start}
.facts .fact .fi{color:var(--muted);flex:none;margin-top:2px}
.facts .fact .fi svg{width:18px;height:18px}
.facts .fact>div{display:flex;flex-direction:column;gap:2px;min-width:0}
.captable{display:grid;grid-template-columns:200px minmax(0,1fr);gap:24px;align-items:center}
@media (max-width:640px){.captable{grid-template-columns:1fr;justify-items:center}}
.donut{width:200px;height:200px;display:block}
.donut circle.seg{transition:stroke-width .15s,opacity .15s;cursor:pointer}
.donut.hl circle.seg{opacity:.35} .donut.hl circle.seg.on{opacity:1;stroke-width:30}
.donut text{fill:var(--ink);font-family:var(--f-body)}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:8px;vertical-align:-1px}
tr.sh{cursor:pointer} tr.sh:hover td,tr.sh.on td{background:var(--sunken)}
tr.shist td{background:var(--bg);font-size:13px}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none;color:var(--ink)}
.people.v2 li{align-items:center;justify-content:flex-start;gap:12px}
.people.v2 .who{display:flex;flex-direction:column;min-width:0}
.people.v2 .who small{color:var(--muted)}
.tl-filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:12.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl::before{content:"";position:absolute;left:79px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl>li{display:grid;grid-template-columns:64px 32px minmax(0,1fr);gap:0;align-items:start;padding:6px 0}
.tl .yr{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);text-align:right;padding-right:8px;padding-top:9px;line-height:1.2}
.tl .node{width:14px;height:14px;border-radius:50%;margin:10px auto 0;box-shadow:0 0 0 3px var(--surface);position:relative;z-index:1}
.tl .body{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;background:var(--surface);cursor:pointer;text-align:left;width:100%}
.tl .body:hover{border-color:var(--accent)}
.tl .body h4{margin:0;font-size:14.5px}
.tl .body .meta{font-size:12.5px;color:var(--muted)}
.tl .det{margin-top:8px;font-size:13.5px}
.tl .det ul{margin:4px 0 0;padding-left:18px}
.kpi-note{font-size:12px;color:var(--muted)}

/* Modal */
.ovl{position:fixed;inset:0;background:rgba(10,16,22,.55);display:flex;align-items:flex-start;justify-content:center;padding:max(24px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) 24px max(12px, env(safe-area-inset-left, 0px));overflow:auto;z-index:50}
.modal{background:var(--surface);border-radius:12px;box-shadow:var(--shadow);width:min(920px,100%);display:flex;flex-direction:column}
.modal header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal header h2{font-size:20px}
.modal .body{padding:16px 20px;display:flex;flex-direction:column;gap:18px}
.modal footer{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap;align-items:center}
.modal footer .msg{margin-right:auto;font-size:13px;color:var(--bad)}
fieldset{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px 14px;margin:0;display:flex;flex-direction:column;gap:12px;min-width:0}
legend{font-weight:700;font-size:13px;padding:0 6px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px 12px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f>span{font-size:12px;color:var(--muted);font-weight:600}
.f input,.f select,.f textarea,.rows input,.rows select{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--bg);min-width:0}
.f textarea{min-height:64px;resize:vertical}
.f.full{grid-column:1/-1}
.rows{display:flex;flex-direction:column;gap:6px}
.rowhead,.row{display:grid;gap:6px;align-items:center}
.rowhead{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.rows-wrap{overflow-x:auto}
.rows-inner{min-width:560px;display:flex;flex-direction:column;gap:6px}
.acuerdo{border-left:3px solid var(--accent)}
.acuerdo .ahead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.add-acuerdo{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.add-acuerdo select{padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.reader{background:var(--accent-soft);border:1px dashed var(--accent);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.reader p{margin:0}
.reader textarea{width:100%;min-height:90px;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);resize:vertical}
.reader .line{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.status{font-size:13px}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="top">
  <div class="brand"><h1>Expediente Corporativo</h1><span>Notaría 26 · Área Corporativo · <b style="color:var(--accent)">Demo con datos ficticios</b></span></div>
  <div class="conn" id="conn"><i class="dot"></i><span>Conectando…</span></div>
</div>
<div class="layout">
  <aside>
    <button class="btn primary" id="btnNueva" type="button">+ Nueva sociedad</button>
    <input class="search" id="q" type="search" placeholder="Buscar por nombre, RFC o folio" aria-label="Buscar sociedad">
    <ul class="soc-list" id="socList"></ul>
  </aside>
  <main id="main">
    <div class="empty">
      <h2>Cargando expedientes…</h2>
      <p>Aquí aparecerán las sociedades registradas con su cuadro accionario y órgano de administración vigentes.</p>
    </div>
  </main>
</div>
<div id="modalRoot"></div>

<script>
/* ============ Utilidades ============ */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const fdate = iso => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || ''); return m ? `${+m[3]} ${MES[+m[2]-1]} ${m[1]}` : (iso ? String(iso) : '—'); };
const nf = new Intl.NumberFormat('es-MX');
const mf = new Intl.NumberFormat('es-MX', {style:'currency', currency:'MXN', maximumFractionDigits:2});
const pf = new Intl.NumberFormat('es-MX', {style:'percent', maximumFractionDigits:2});
const num = v => { const n = typeof v === 'number' ? v : parseFloat(String(v ?? '').replace(/[^0-9.\-]/g, '')); return Number.isFinite(n) ? n : 0; };
const str = v => (v == null ? '' : String(v)).trim();
const isoOr = v => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(str(v)); return m ? m[0] : ''; };
const keyOf = s => str(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase().replace(/[^A-Z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();
const clone = o => JSON.parse(JSON.stringify(o));
const uid = () => 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

/* ============ Catálogo de acuerdos ============ */
const TIPOS = {
  constitucion: 'Constitución',
  aumento: 'Aumento de capital',
  disminucion: 'Disminución de capital',
  transmision: 'Transmisión de acciones',
  administracion: 'Órgano de administración',
  comisario: 'Comisario / vigilancia',

    (m.acuerdos || []).filter(a => a.tipo === 'reforma').forEach(a => { if (str(a.denominacion)) den = str(a.denominacion); if (str(a.regimen)) reg = str(a.regimen); });

const histPorId = (movs, S) => { const h = nombresHistoricos(movs, S); const map = new Map(); sortMovs(movs).forEach((m, i) => map.set(m.id, h[i])); return map; };

/* ============ Motor: situación vigente a partir de los movimientos ============ */
function sortMovs(movs){
  return [...movs].sort((a, b) => (a.instrumento?.fecha || '9999').localeCompare(b.instrumento?.fecha || '9999') || (a.creado || 0) - (b.creado || 0));
}
function compute(soc, movs){

    constitucion: null, ultimaReforma: null, alertas: [], sinInscripcion: [], extranjeros: null, nac: new Map(), ie: null
  };
  const setNac = (socio, n) => { if (str(socio) && str(n)) S.nac.set(keyOf(socio), str(n)); };
  const add = (socio, serie, clase, n, m) => {
    const k = `${keyOf(socio)}|${keyOf(serie)}|${clase}`;
    const cur = S.hold.get(k) || {socio: str(socio), serie: str(serie), clase, acciones: 0};
    cur.acciones += n;
    if (cur.acciones < 0){ S.alertas.push({nivel:'bad', txt:`${cur.socio || 'Accionista sin nombre'} queda con saldo negativo (${nf.format(cur.acciones)} acciones serie ${cur.serie || '—'}) después de ${fuente(m)}. Revisa la captura.`}); }
    S.hold.set(k, cur);
  };
  for (const m of sortMovs(movs)){
    if (!inscrito(m) && m.instrumento?.tipo !== 'Acta de asamblea') S.sinInscripcion.push(m);
    for (const a of (m.acuerdos || [])){
      switch (a.tipo){
        case 'constitucion':
          ['denominacion','regimen','domicilio','duracion','objeto','giros'].forEach(k => { if (str(a[k])) S[k] = str(a[k]); });
          if (num(a.valorNominal)) S.valorNominal = num(a.valorNominal);
          S.hold = new Map();
          if (normClausula(a.extranjeros)) S.extranjeros = {clausula: normClausula(a.extranjeros), m};
          (a.tenencias || []).forEach(r => { setNac(r.socio, r.nacionalidad); num(r.acciones) && add(r.socio, r.serie, r.clase, num(r.acciones), m); });
          if (str(a.formaAdmin) || (a.miembros || []).some(r => str(r.nombre))) S.admin = {forma: str(a.formaAdmin), miembros: (a.miembros || []).filter(r => str(r.nombre)), m};
          if ((a.comisarios || []).some(r => str(r.nombre))) S.comisarios = {lista: a.comisarios.filter(r => str(r.nombre)), m};
          S.constitucion = m;
          break;
        case 'aumento':
          (a.tenencias || []).forEach(r => setNac(r.socio, r.nacionalidad));
          (a.tenencias || []).forEach(r => num(r.acciones) && add(r.socio, r.serie, r.clase, Math.abs(num(r.acciones)), m));
          break;
        case 'disminucion':
          (a.tenencias || []).forEach(r => num(r.acciones) && add(r.socio, r.serie, r.clase, -Math.abs(num(r.acciones)), m));
          break;
        case 'transmision':
          (a.transmisiones || []).forEach(r => { setNac(r.a, r.nacionalidad); const n = Math.abs(num(r.acciones)); if (!n) return; add(r.de, r.serie, r.clase, -n, m); add(r.a, r.serie, r.clase, n, m); });
          break;
        case 'administracion':
          S.admin = {forma: str(a.formaAdmin), miembros: (a.miembros || []).filter(r => str(r.nombre)), m};
          break;
        case 'comisario':
          S.comisarios = {lista: (a.comisarios || []).filter(r => str(r.nombre)), m};
          break;
        case 'poder':
          (a.poderes || []).forEach(r => { if (str(r.apoderado)) S.poderes.set(keyOf(r.apoderado) + '|' + keyOf(r.facultades), {...r, m}); });
          break;
        case 'revocacion':
          (a.revocados || []).forEach(r => {
            const k = keyOf(r.apoderado); if (!k) return;
            let hit = false;
            for (const pk of [...S.poderes.keys()]) if (pk.startsWith(k + '|')){ S.poderes.delete(pk); hit = true; }
            if (!hit) S.alertas.push({nivel:'warn', txt:`Se revoca el poder de ${str(r.apoderado)} en ${fuente(m)}, pero no hay un otorgamiento previo capturado.`});
          });
          break;
        case 'reforma':
          ['denominacion','regimen','domicilio','duracion','objeto','giros'].forEach(k => { if (str(a[k])) S[k] = str(a[k]); });
          if (num(a.valorNominal)) S.valorNominal = num(a.valorNominal);
          if (normClausula(a.extranjeros)) S.extranjeros = {clausula: normClausula(a.extranjeros), m};
          S.ultimaReforma = {m, clausulas: str(a.clausulas)};
          break;
      }
    }
  }
  for (const [k, v] of S.hold) if (!v.acciones) S.hold.delete(k);
  const CA = soc?.cuadroActa;
  if (CA && (CA.tenencias || []).length){
    const pm = {instrumento: {tipo: 'Acta de asamblea', numero: '', fecha: CA.fecha || ''}, acuerdos: []};
    const capturado = [...S.hold.values()].reduce((x, h) => x + h.acciones, 0);
    const delActa = CA.tenencias.reduce((x, r) => x + num(r.acciones), 0);
    const firma = arr => arr.map(h => keyOf(h.socio) + ':' + num(h.acciones)).sort().join('|');
    const difiere = firma([...S.hold.values()].map(h => ({socio: h.socio, acciones: h.acciones}))) !== firma(CA.tenencias.map(r => ({socio: r.socio, acciones: r.acciones})));
    const ultCap = sortMovs(movs).filter(m => (m.acuerdos || []).some(x => ['constitucion','aumento','disminucion','transmision'].includes(x.tipo))).pop();
    const actaMasReciente = !ultCap || (CA.fecha && CA.fecha >= (ultCap.instrumento?.fecha || ''));
    if (capturado && actaMasReciente && difiere) S.alertas.push({nivel:'warn', txt:`El cuadro que resulta de los instrumentos capturados no coincide con ${CA.fuente || 'la última lista de asistencia'}${capturado !== delActa ? ` (${nf.format(capturado)} contra ${nf.format(delActa)} acciones)` : ' (mismo capital, distintos titulares o tenencias)'}. Se muestra el de la lista de asistencia; faltan instrumentos por capturar.`});
    if (!capturado || (actaMasReciente && difiere)){
      S.hold = new Map(); CA.tenencias.forEach(r => { const k = `${keyOf(r.socio)}|${keyOf(r.serie)}|${r.clase}`; S.hold.set(k, {socio: str(r.socio), serie: str(r.serie), clase: r.clase === 'variable' ? 'variable' : 'fijo', acciones: num(r.acciones)}); });
      if (num(CA.valorNominal) && !S.valorNominal) S.valorNominal = num(CA.valorNominal);
      S.cuadroFuente = CA.fuente || 'Lista de asistencia del acta';
    } else if (!actaMasReciente && difiere) S.alertas.push({nivel:'warn', txt:`El cuadro calculado (${nf.format(capturado)}) no coincide con el de ${CA.fuente || 'la última acta'} (${nf.format(delActa)}). Falta capturar algún movimiento.`});
    if (CA.admin && (CA.admin.miembros || []).length && !(S.admin?.miembros || []).length) S.admin = {forma: str(CA.admin.forma) || S.admin?.forma || '', miembros: CA.admin.miembros, m: pm};
  }
  // Inversión extranjera: titulares vigentes cuya nacionalidad capturada no es mexicana
  (CA?.tenencias || []).forEach(r => setNac(r.socio, r.nacionalidad));
  const tot = [...S.hold.values()].reduce((x, h) => x + h.acciones, 0);
  const ext = new Map();
  for (const h of S.hold.values()){ const nac = S.nac.get(keyOf(h.socio)); if (!esExtranjera(nac)) continue; const r = ext.get(keyOf(h.socio)) || {socio: h.socio, nacionalidad: nac, acciones: 0}; r.acciones += h.acciones; ext.set(keyOf(h.socio), r); }
  if (ext.size){
    const acc = [...ext.values()].reduce((x, r) => x + r.acciones, 0);
    S.ie = {rows: [...ext.values()].sort((a, b) => b.acciones - a.acciones), acciones: acc, pct: tot ? acc / tot : 0};
    const quien = S.ie.rows.map(r => `${r.socio} (${r.nacionalidad})`).join(', ');
    if (S.extranjeros?.clausula === 'Exclusión de extranjeros') S.alertas.push({nivel:'bad', txt:`Los estatutos tienen cláusula de exclusión de extranjeros (${fuente(S.extranjeros.m)}), pero hay titulares extranjeros: ${quien}. Revisa la captura o los estatutos.`});
    else if (!S.extranjeros) S.alertas.push({nivel:'warn', txt:`Hay titulares extranjeros (${quien}) y no está capturada la cláusula de admisión o exclusión de extranjeros.`});
  }
  if (movs.length && !S.constitucion) S.alertas.push({nivel:'warn', txt:'No hay escritura constitutiva capturada. El cuadro accionario parte de cero y puede no reflejar la composición real.'});
  return S;
}
function cuadro(S){
  const by = new Map();
  for (const h of S.hold.values()){
    const k = keyOf(h.socio);
    const r = by.get(k) || {socio: h.socio, series: new Set(), fijo: 0, variable: 0};
    if (h.serie) r.series.add(h.serie);
    r[h.clase === 'variable' ? 'variable' : 'fijo'] += h.acciones;
    by.set(k, r);
  }
  const rows = [...by.values()].map(r => ({...r, serie: [...r.series].sort().join(', '), total: r.fijo + r.variable}));
  const tot = rows.reduce((s, r) => ({fijo: s.fijo + r.fijo, variable: s.variable + r.variable, total: s.total + r.total}), {fijo:0, variable:0, total:0});
  rows.sort((a, b) => b.total - a.total || a.socio.localeCompare(b.socio));
  return {rows, tot};
}
function describe(a, vn){
  const acc = n => `${nf.format(n)} acc.`;
  const tl = r => `${acc(Math.abs(num(r.acciones)))}${r.serie ? ' serie ' + r.serie : ''} (${r.clase === 'variable' ? 'variable' : 'fijo'})`;
  const names = (rows, f = 'nombre') => (rows || []).filter(r => str(r[f])).map(r => r[f] + (r.cargo ? ` (${r.cargo})` : '')).join('; ');
  switch (a.tipo){
    case 'constitucion': {
      const t = (a.tenencias || []).reduce((s, r) => s + num(r.acciones), 0);
      const v = num(a.valorNominal);
      return `Constitución de ${a.denominacion || 'la sociedad'}${a.regimen ? ', ' + a.regimen.replace(/\.$/, '') : ''}. Capital inicial: ${acc(t)}${v ? ' (' + mf.format(t * v) + ')' : ''}.${normClausula(a.extranjeros) ? ' ' + normClausula(a.extranjeros) + '.' : ''}${a.formaAdmin ? ' Administración: ' + a.formaAdmin + (names(a.miembros) ? ', ' + names(a.miembros) : '') + '.' : ''}`;
    }
    case 'aumento': return `Aumento de capital: ${(a.tenencias || []).filter(r => num(r.acciones)).map(r => `${tl(r)} suscritas por ${r.socio || '—'}`).join('; ') || 'sin detalle'}.${a.notas ? ' ' + a.notas : ''}`;
    case 'disminucion': return `Disminución de capital: ${(a.tenencias || []).filter(r => num(r.acciones)).map(r => `${tl(r)} de ${r.socio || '—'}`).join('; ') || 'sin detalle'}.${a.notas ? ' ' + a.notas : ''}`;
    case 'transmision': return `Transmisión: ${(a.transmisiones || []).filter(r => num(r.acciones)).map(r => `${r.de || '—'} a ${r.a || '—'}, ${tl(r)}`).join('; ') || 'sin detalle'}.`;
    case 'administracion': return `Nombramiento de ${a.formaAdmin || 'órgano de administración'}${names(a.miembros) ? ': ' + names(a.miembros) : ''}.`;
    case 'comisario': return `Vigilancia: ${names(a.comisarios) || 'sin detalle'}.`;
    case 'poder': return `Poderes a ${(a.poderes || []).filter(r => str(r.apoderado)).map(r => r.apoderado + (r.facultades ? ` (${r.facultades})` : '')).join('; ') || '—'}.`;
    case 'revocacion': return `Revocación de poderes de ${names(a.revocados, 'apoderado') || '—'}.`;
    case 'reforma': {
      const cambios = [['denominacion','denominación'],['regimen','régimen'],['domicilio','domicilio'],['duracion','duración'],['objeto','objeto'],['valorNominal','valor nominal'],['extranjeros','cláusula de extranjeros']].filter(([k]) => str(a[k])).map(([k, l]) => `${l}: ${k === 'valorNominal' ? mf.format(num(a[k])) : a[k]}`);
      return `Reforma de estatutos${a.clausulas ? ' (cláusulas ' + a.clausulas + ')' : ''}${cambios.length ? '. ' + cambios.join('; ') : ''}.`;
    }

}

let db = null, user = null, canWrite = true;
const store = {
  mode: 'mem', mem: {soc: new Map(), movs: new Map()}, subs: {soc: null, movs: null},
  newId(){ return db ? db.collection('sociedades').doc().id : uid(); },
  listenSoc(cb){
    if (db){
      const t = setTimeout(() => setConn('warn', 'Sin respuesta de la base de datos'), 10000);
      return db.collection('sociedades').onSnapshot(s => { clearTimeout(t); if (!s.metadata.fromCache) setConn('ok', 'Guardado en la nube'); cb(s.docs.map(d => ({id: d.id, ...d.data()}))); }, e => { clearTimeout(t); setConn('warn', 'No se pudo leer la base de datos'); console.warn(e); cb([]); });
    }
    this.subs.soc = cb; cb([...this.mem.soc.values()]); return () => {};
  },
  listenMovs(sid, cb){
    if (db){
      return db.collection(`sociedades/${sid}/movimientos`).onSnapshot(s => cb(s.docs.map(d => ({id: d.id, ...d.data()}))), e => { console.warn(e); cb([]); });
    }
    this.subs.movs = {sid, cb}; cb([...(this.mem.movs.get(sid) || new Map()).values()]); return () => { this.subs.movs = null; };
  },
  async saveSoc(id, data){
    if (db) return db.doc(`sociedades/${id}`).set(data);
    this.mem.soc.set(id, {id, ...data}); this.subs.soc?.([...this.mem.soc.values()]);
  },
  async saveMov(sid, id, data){
    if (db) return db.doc(`sociedades/${sid}/movimientos/${id}`).set(data);
    if (!this.mem.movs.has(sid)) this.mem.movs.set(sid, new Map());
    this.mem.movs.get(sid).set(id, {id, ...data}); this.emitMovs(sid);
  },
  async delMov(sid, id){
    if (db) return db.doc(`sociedades/${sid}/movimientos/${id}`).delete();
    this.mem.movs.get(sid)?.delete(id); this.emitMovs(sid);
  },
  async delSoc(id, movIds){
    if (db){ for (const m of movIds) await db.doc(`sociedades/${id}/movimientos/${m}`).delete(); return db.doc(`sociedades/${id}`).delete(); }
    this.mem.movs.delete(id); this.mem.soc.delete(id); this.subs.soc?.([...this.mem.soc.values()]);
  },
  emitMovs(sid){ if (this.subs.movs?.sid === sid) this.subs.movs.cb([...this.mem.movs.get(sid).values()]); }
};

/* ============ Modal genérico ============ */
function openModal(html){ $('#modalRoot').innerHTML = `<div class="ovl" id="ovl"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`; setTimeout(() => $('#ovl input, #ovl select, #ovl textarea')?.focus(), 30); }
function closeModal(){ D.ctl?.abort(); $('#modalRoot').innerHTML = ''; D.draft = null; }
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#ovl')) closeModal(); });

function socModal(soc){
  D.fiscal = null;
  const s = soc || {denominacion:'', regimen:'S.A. de C.V.', rfc:'', fme:'', domicilio:'', notas:''};
  openModal(`<header><h2>${soc ? 'Datos de la sociedad' : 'Nueva sociedad'}</h2><button class="btn ghost" type="button" data-act="close" aria-label="Cerrar">✕</button></header>
  <form id="socForm"><div class="body"><div class="fgrid">

function loadPdfJs(){
  if (pdfReady) return pdfReady;
  const base = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
  const load = src => new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('pdf')); document.head.appendChild(s); });
  pdfReady = load(base + 'pdf.min.js').then(() => load(base + 'pdf.worker.min.js')).then(() => { window.pdfjsLib.GlobalWorkerOptions.workerSrc = base + 'pdf.worker.min.js'; return window.pdfjsLib; });
  pdfReady.catch(() => { pdfReady = null; });
  return pdfReady;
}
async function readPdf(file, from, to, say){
  const lib = await loadPdfJs();
  const doc = await lib.getDocument({data: new Uint8Array(await file.arrayBuffer())}).promise;
  const a = Math.max(1, from), b = Math.min(doc.numPages, Math.max(a, to));
  let text = '';
  for (let p = a; p <= b; p++){
    say(`Leyendo página ${p} de ${b}…`);
    const tc = await (await doc.getPage(p)).getTextContent();
    text += `\n[Página ${p}]\n` + tc.items.map(i => i.str).join(' ');
  }
  return {doc, text, a, b, pages: doc.numPages};
}
async function pagesToImages(doc, a, b, max, say){
  const blobs = [];
  for (let p = a; p <= b && blobs.length < max; p++){
    say(`Preparando imagen de la página ${p}…`);
    const page = await doc.getPage(p);
    const v0 = page.getViewport({scale: 1});
    const vp = page.getViewport({scale: Math.min(2, 1400 / v0.width)});
    const cv = document.createElement('canvas'); cv.width = vp.width; cv.height = vp.height;
    await page.render({canvasContext: cv.getContext('2d'), viewport: vp}).promise;
    blobs.push(await new Promise(r => cv.toBlob(r, 'image/jpeg', 0.82)));
  }
  return blobs;
}

async function leer(){
  const say = t => { const el = $('#rdMsg'); if (el) el.textContent = t; };
  if (!sample){ say('Esta función solo está disponible al abrir la página en claude.ai.'); return; }
  const files = [...($('#rdFile').files || [])];
  const pasted = str($('#rdText').value);
  if (!files.length && !pasted){ say('Sube un archivo o pega el texto primero.'); return; }
  const from = Math.max(1, num($('#rdFrom').value) || 1), to = Math.max(from, num($('#rdTo').value) || from + 19);
  D.ctl?.abort(); D.ctl = new AbortController();
  const btnStop = $('#rdStop'); btnStop.hidden = false;
  try {
    let input = PROMPT, images;
    const maxImg = sampleImages?.maxCount || 0;
    const pdf = files.find(f => f.type === 'application/pdf');
    const imgs = files.filter(f => f.type.startsWith('image/'));
    if (pasted){
      input += `\n\nTexto del instrumento:\n"""\n${pasted.slice(0, 150000)}\n"""`;
    } else if (pdf){
      say('Cargando el lector de PDF…');
      const r = await readPdf(pdf, from, to, say);
      const useful = r.text.replace(/\[Página \d+\]/g, '').replace(/\s+/g, '').length;
      if (useful > 400 * (r.b - r.a + 1) * 0.25){
        input += `\n\nTexto del instrumento (páginas ${r.a} a ${r.b} de ${r.pages}):\n"""\n${r.text.slice(0, 150000)}\n"""`;
      } else {
        if (!maxImg){ say('El PDF parece escaneado y esta vista no puede enviar imágenes. Pega el texto o usa un PDF con texto.'); return; }
        images = await pagesToImages(r.doc, r.a, r.b, maxImg, say);
        input += `\n\nLas imágenes adjuntas son las páginas ${r.a} a ${r.a + images.length - 1} de ${r.pages} del instrumento escaneado.`;
      }
    } else if (imgs.length){
      if (!maxImg){ say('Esta vista no puede enviar imágenes a Claude. Pega el texto.'); return; }
      images = imgs.slice(0, maxImg);
      input += `\n\nLas imágenes adjuntas son hojas del instrumento, en orden.`;
    } else { say('Formato no reconocido. Usa PDF, imagen o texto.'); return; }
    say('Claude está leyendo el instrumento… (puede tardar uno o dos minutos)');
    const opts = {signal: D.ctl.signal, modelTier: 'default'};
    if (images?.length) opts.images = images;
    const j = await sample.json(input, opts);
    const nd = fromAI(j);
    const keep = D.draft;
    D.draft = nd;
    if (!nd.instrumento.fecha && keep.instrumento.fecha) nd.instrumento.fecha = keep.instrumento.fecha;
    renderMovBody();
    $('#rdMsg').textContent = `Listo: ${nd.acuerdos.length} acuerdo(s) detectados. Revisa cada campo antes de guardar.`;
  } catch (err){
    const c = err?.code;
    say(c === 'cancelled' ? 'Lectura detenida.' : c === 'not_granted' || c === 'sampling_disabled' ? 'Claude no tiene permiso en esta página. Actívalo en el menú de permisos del artifact.' : c === 'rate_limited' ? 'Demasiadas solicitudes. Espera un momento e intenta de nuevo.' : c === 'invalid_json' ? 'Claude no devolvió una captura válida. Intenta con menos páginas.' : c === 'prompt_too_large' ? 'El texto es demasiado largo. Reduce el rango de páginas.' : c === 'image_rejected' ? 'Alguna imagen no se pudo leer. Prueba con otra.' : err?.message === 'pdf' ? 'No se pudo cargar el lector de PDF.' : 'No se pudo leer el instrumento. Intenta de nuevo.');
    console.warn(err);
  } finally { const b = $('#rdStop'); if (b) b.hidden = true; }
}

async function leerCSF(){
  const say = t => { const el = $('#csfMsg'); if (el) el.textContent = t; };
  if (!sample){ say('Disponible al abrir la página en claude.ai.'); return; }
  const f = $('#csfFile').files?.[0]; if (!f){ say('Elige el PDF de la constancia.'); return; }
  const P = 'Lee esta Constancia de Situación Fiscal del SAT de una persona moral mexicana y devuelve SOLO JSON: {"rfc":"","razonSocial":"","regimenCapital":"","estatus":"estatus en el padrón","fechaInicio":"AAAA-MM-DD","fechaEmision":"AAAA-MM-DD (lugar y fecha de emisión)","domicilioFiscal":"calle, número, colonia, CP, municipio, estado","regimenes":["régimen fiscal"],"actividades":[{"actividad":"","porcentaje":"","desde":"AAAA-MM-DD"}]}. No inventes; deja "" si no consta.';
  try {
    let input = P, images;
    if (f.type === 'application/pdf'){
      say('Leyendo el PDF…');
      const r = await readPdf(f, 1, 4, say);
      if (r.text.replace(/\[Página \d+\]|\s/g, '').length > 300) input += '\n\nTexto de la constancia:\n<<<\n' + r.text.slice(0, 60000) + '\n>>>';
      else { if (!sampleImages?.maxCount){ say('El PDF está escaneado y esta vista no puede enviar imágenes.'); return; } images = await pagesToImages(r.doc, r.a, r.b, Math.min(4, sampleImages.maxCount), say); }
    } else { if (!sampleImages?.maxCount){ say('Esta vista no puede enviar imágenes.'); return; } images = [f]; }
    say('Claude está leyendo la constancia…');
    const j = await sample.json(input, images ? {images} : {});
    D.fiscal = {rfc: str(j.rfc).toUpperCase(), razonSocial: str(j.razonSocial), regimenCapital: str(j.regimenCapital), estatus: str(j.estatus), fechaInicio: isoOr(j.fechaInicio), fechaEmision: isoOr(j.fechaEmision), domicilioFiscal: str(j.domicilioFiscal), regimenes: (j.regimenes || []).map(str).filter(Boolean), actividades: (j.actividades || []).map(a => ({actividad: str(a.actividad), porcentaje: str(a.porcentaje), desde: isoOr(a.desde)})).filter(a => a.actividad)};
    if (D.fiscal.rfc && !str($('#s_rfc').value)) $('#s_rfc').value = D.fiscal.rfc;
    say('Listo: ' + (D.fiscal.rfc || 'sin RFC') + ' · ' + D.fiscal.actividades.length + ' actividades. Guarda para aplicar.');
  } catch (err){ say(err?.code === 'not_granted' ? 'Claude no tiene permiso en esta página.' : 'No se pudo leer la constancia.'); console.warn(err); }
}

Sociedad: ${S.denominacion}, ${S.regimen}. Folio mercantil: ${soc.fme || 'no capturado'}. Domicilio: ${S.domicilio || 'no capturado'}.
Valor nominal: ${vn || 'no capturado'}. Capital total: ${C.tot.total} acciones (${C.tot.fijo} fijo, ${C.tot.variable} variable).
Cuadro accionario:
${cuadroTxt || '- sin datos'}
Administración: ${S.admin ? (S.admin.forma + ': ' + S.admin.miembros.map(r => r.nombre + (r.cargo ? ' (' + r.cargo + ')' : '')).join('; ')) : 'no capturada'}
Comisario: ${S.comisarios ? S.comisarios.lista.map(r => r.nombre).join('; ') : 'no capturado'}

Cláusula de extranjeros: ${S.extranjeros ? S.extranjeros.clausula + ' (' + fuente(S.extranjeros.m) + ')' : 'no capturada'}
Inversión extranjera: ${S.ie ? (S.ie.pct * 100).toFixed(2) + '% del capital: ' + S.ie.rows.map(r => r.socio + ' (' + r.nacionalidad + ')').join('; ') + '. RNIE: ' + (soc.rnie || 'no capturado') : 'no hay titulares extranjeros capturados'}
Alertas del sistema: ${S.alertas.map(a => a.txt).join(' | ') || 'ninguna'}
Cronología:
${crono}`;
  V.ia.ctl?.abort(); V.ia.ctl = new AbortController(); V.ia.busy = true; renderMain();
  const out = () => $('#iaOut');
  out().innerHTML = '<span class="muted">Claude está redactando…</span>';

Administración vigente: ${S.admin ? S.admin.forma + ': ' + S.admin.miembros.map(r => r.nombre + (r.cargo ? ' (' + r.cargo + ')' : '')).join('; ') + ' — según ' + fuente(S.admin.m) : 'no capturada'}
Poderes vigentes: ${[...S.poderes.values()].map(p => `${p.apoderado} (${p.facultades || 's/d'}; ${p.notas || ''}) — según ${fuente(p.m)}`).join(' | ') || 'ninguno capturado'}
Compareciente: ${comp ? comp.replace('|', ', en su carácter de ') : 'ninguno: redacta solo la legal existencia'}

document.addEventListener('click', async e => {
  const t = e.target.closest('[data-act],[data-sid],[data-tab],[data-tl],[data-tlopen],[data-sh],[data-capv]');
  if (!t) { if (e.target.id === 'ovl') closeModal(); return; }
  if (t.dataset.sid){ selectSoc(t.dataset.sid); return; }
  if (t.dataset.tab){ V.tab = t.dataset.tab; renderMain(); return; }
  if (t.dataset.capv){ V.capVista = t.dataset.capv; try { localStorage.setItem('expcorp-capv', V.capVista); } catch {} renderMain(); return; }
  if (t.dataset.tl){ V.tlFiltro = t.dataset.tl; renderMain(); return; }
  if (t.dataset.tlopen){ const id = t.dataset.tlopen; V.tlOpen.has(id) ? V.tlOpen.delete(id) : V.tlOpen.add(id); renderMain(); return; }
  if (t.dataset.sh !== undefined){ const k = keyOf(t.dataset.socio); if (!k) return; V.socioOpen = V.socioOpen === k ? null : k; renderMain(); return; }
  const act = t.dataset.act;
  if (act === 'close') return closeModal();
  if (act === 'nueva') return socModal(null);
  if (act === 'editsoc') return socModal(curSoc());
  if (act === 'nuevomov') return movModal(null);
  if (act === 'editmov') return movModal(V.movs.find(m => m.id === t.dataset.id));
  if (act === 'delmov'){
    const z = $('#acts-' + CSS.escape(t.dataset.id));
    z.innerHTML = `<span class="confirm"><span style="font-size:13px">¿Eliminar este instrumento del expediente?</span><button class="btn small danger" type="button" data-act="delmovok" data-id="${esc(t.dataset.id)}">Sí, eliminar</button><button class="btn small" type="button" data-act="cancelrender">No</button></span>`;
    return;
  }
  if (act === 'delmovok'){ try { await store.delMov(V.sid, t.dataset.id); } catch (err){ alertMain(saveError(err)); } return; }
  if (act === 'cancelrender') return renderMain();
  if (act === 'delsoc'){
    $('#delZone').innerHTML = `<span class="confirm"><span style="font-size:13px">Se borran la sociedad y sus ${V.movs.length} instrumentos.</span><button class="btn small danger" type="button" data-act="delsocok">Confirmar</button></span>`;
    return;
  }
  if (act === 'delsocok'){
    const id = V.sid;
    try { await store.delSoc(id, V.movs.map(m => m.id)); closeModal(); selectSoc(null); } catch (err){ $('#socMsg').textContent = saveError(err); }
    return;
  }
  if (act === 'addrow'){ getPath(D.draft, t.dataset.k).push(blankRow(t.dataset.kind)); renderMovBody(); return; }
  if (act === 'delrow'){ getPath(D.draft, t.dataset.k).splice(+t.dataset.i, 1); renderMovBody(); return; }
  if (act === 'addacuerdo'){ D.draft.acuerdos.push(blankAcuerdo($('#newTipo').value)); renderMovBody(); $('#movBody').lastElementChild?.previousElementSibling?.scrollIntoView({block:'nearest'}); return; }
  if (act === 'delacuerdo'){ D.draft.acuerdos.splice(+t.dataset.i, 1); renderMovBody(); return; }
  if (act === 'leer') return leer();
  if (act === 'leercsf') return leerCSF();
  if (act === 'leerstop') return D.ctl?.abort();
  if (act === 'ia') return redactar();
  if (act === 'per') return redactarPersonalidad();
  if (act === 'copiar'){ const el = $('#' + t.dataset.src); try { await navigator.clipboard.writeText(el.innerText); t.textContent = 'Copiado'; } catch { const r = document.createRange(); r.selectNodeContents(el); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); t.textContent = 'Texto seleccionado: usa Cmd+C'; } setTimeout(() => { t.textContent = 'Copiar texto'; }, 2500); return; }
  if (act === 'iastop') return V.ia.ctl?.abort();
});
